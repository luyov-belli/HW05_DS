# Tarea 2 — Guiones de llamadas de venta (dominio: restaurante, pollería inventada "La Brasa Real").
# Todo es inventado: direcciones, montos y personas no corresponden a nadie real.
# El "guion" es también la transcripción de referencia: si al grabar alguien se desvía,
# corrige aquí el texto para que diga exactamente lo que se escucha en el audio.
# A = vendedor(a), B = cliente.
#
# trampas:
#   correccion     -> el cliente cambia el pedido a mitad de la llamada (el registro debe tener el final)
#   total_erroneo  -> el total dicho en voz alta NO cuadra a propósito (el validador debe atraparlo)
# La carta y las promociones (precios de referencia) están en config.yaml -> schemas.pedido.

- id: L01
  trampas: [correccion]
  nota: "Medio pollo -> pollo entero. Total correcto: 69 + 18 + 16 = 103."
  campos:
    items:
      - {producto: pollo a la brasa, tamano: entero, cantidad: 1, precio_unitario: 69}
      - {producto: papas fritas, tamano: familiar, cantidad: 1, precio_unitario: 18}
      - {producto: chicha morada, tamano: jarra, cantidad: 1, precio_unitario: 16}
    promocion: null
    direccion_entrega: avenida los proceres 845 santiago de surco
    metodo_pago: yape
    total_dicho: 103
  guion: |
    A: Pollería La Brasa Real, buenas noches, le habla Adrián. ¿Qué le gustaría pedir?
    B: Hola, buenas noches. Quería medio pollo a la brasa, por favor.
    A: Claro, medio pollo. ¿Con qué lo acompaña?
    B: Con unas papas fritas familiares y una jarra de chicha morada.
    A: Perfecto. ¿Algo más?
    B: Espere, acaban de llegar mis primos. Mejor cámbieme el medio pollo por un pollo entero.
    A: No hay problema, entonces queda un pollo entero en lugar del medio. ¿Las papas y la chicha se mantienen?
    B: Sí, eso se mantiene igual.
    A: Muy bien. ¿A qué dirección se lo enviamos?
    B: Avenida Los Próceres ochocientos cuarenta y cinco, en Santiago de Surco. Es una casa con la puerta verde.
    A: Avenida Los Próceres ochocientos cuarenta y cinco, Surco, anotado. ¿Cómo va a pagar?
    B: Con Yape, por favor.
    A: Listo. Le confirmo el pedido: un pollo entero a sesenta y nueve soles, unas papas fritas familiares a dieciocho soles y una jarra de chicha morada a dieciséis soles. El total sería ciento tres soles.
    B: Perfecto. ¿Cuánto se demora?
    A: Unos cuarenta minutos aproximadamente. Le llega un mensaje cuando el motorizado salga.
    B: Genial, muchas gracias.
    A: Gracias a usted, buen provecho.

- id: L02
  trampas: [correccion, total_erroneo]
  nota: "Quita las gaseosas, pone dos vasos de chicha. 44 + 12 + 9 = 65, menos 10 % = 58,50. Se dice 62,50."
  campos:
    items:
      - {producto: pollo a la brasa, tamano: cuarto, cantidad: 2, precio_unitario: 22}
      - {producto: chicha morada, tamano: vaso, cantidad: 2, precio_unitario: 6}
      - {producto: ensalada, tamano: null, cantidad: 1, precio_unitario: 9}
    promocion: martes brasero
    direccion_entrega: jiron huascar 1450 departamento 302 jesus maria
    metodo_pago: tarjeta
    total_dicho: 62.5
  guion: |
    A: La Brasa Real, buenas tardes. ¿En qué le puedo ayudar?
    B: Buenas tardes. Quisiera hacer un pedido para dos personas.
    A: Claro, dígame.
    B: Dos cuartos de pollo a la brasa, dos gaseosas personales y una ensalada.
    A: Perfecto. Le comento que hoy tenemos la promoción martes brasero, que le da diez por ciento de descuento en todo el pedido.
    B: Ah, qué bien. Oiga, y pensándolo mejor, quíteme las gaseosas y póngame dos vasos de chicha morada.
    A: Entendido, sin gaseosas y con dos vasos de chicha. Entonces son dos cuartos de pollo, dos vasos de chicha y una ensalada. ¿La dirección de entrega?
    B: Jirón Huáscar mil cuatrocientos cincuenta, departamento trescientos dos, en Jesús María.
    A: Jirón Huáscar mil cuatrocientos cincuenta, departamento trescientos dos. ¿Alguna referencia?
    B: Está al costado de una farmacia.
    A: Gracias. ¿Cómo desea pagar?
    B: Con tarjeta, por favor. Que el motorizado lleve el POS.
    A: Perfecto, con tarjeta. Le confirmo: dos cuartos de pollo a veintidós soles cada uno, dos vasos de chicha morada a seis soles cada uno y una ensalada a nueve soles. Con el descuento del martes brasero, el total sería sesenta y dos con cincuenta.
    B: Muy bien, gracias.
    A: Gracias a usted, en unos treinta y cinco minutos le llega.

